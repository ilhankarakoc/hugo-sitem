<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oto Çilingir - cilingirnumarasi.com</title>
    <style>
        .neon-glow-card {
            background: rgba(8, 10, 15, 0.85);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2), inset 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .glow-gold-btn {
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
            animation: goldPulse 2s infinite alternate;
        }

        @keyframes goldPulse {
            0% {
                box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 35px rgba(212, 175, 55, 0.6);
                transform: scale(1.02);
            }
        }
    </style>
</head>

<body class="bg-[#0b0d0c] text-neutral-200 font-sans antialiased min-h-screen flex flex-col justify-between relative bg-contain bg-center bg-no-repeat" style="background-image: url('/static/oto-cilingir.jpg');">

    <!-- Header -->
    <header class="w-full max-w-7xl mx-auto px-4 py-6 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3">
            <!-- LOGO RESMİ TAM İSTEDİĞİNİZ GİBİ STATIC İÇİNDEN ÇAĞRILDI -->
            <div class="w-10 h-10 rounded-full border border-[#dafa57]/40 overflow-hidden bg-neutral-950 shadow-md">
                <img src="/static/cilingir-numarasi.jpg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="font-logo text-sm md:text-base font-text-transparent bg-clip-text bg-gradient-to-r from-[#fa3e5a] via-[#dafa57] to-[#aa3721]">
                <span class="text-[8px] text-neutral-500 tracking-widest uppercase block">7/24 Güvenlik Ağı</span>
                cilingirnumarasi.com
            </span>
        </div>
    </header>

    <!-- Ana İçerik Alanı (Gerekiyorsa buraya eklenebilir) -->
    <main class="flex-grow flex items-center justify-center p-4">
        <!-- İhtiyacınıza göre butonları veya kartları bu kısma yerleştirebilirsiniz -->
    </main>

    <!-- Footer Alanı (Gerekiyorsa buraya eklenebilir) -->
    <footer class="w-full text-center py-4 text-xs text-neutral-500">
        &copy; 2026 cilingirnumarasi.com. Tüm Hakları Saklıdır.
    </footer>

</body>
</html>
