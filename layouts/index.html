<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çilingir Numarası - cilingirnumarasi.com</title>
    <style>
        /* Tüm boşlukları sıfırlayarak resmi tam ekran yapıyoruz */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
        }

        /* Yapay zeka ile hazırladığınız Türkiye haritalı ana görsel */
        .bg-container {
            width: 100%;
            height: 100%;
            /* Hugo'nun kendi resmi bulma fonksiyonunu ekledik */
            background-image: url('{{ "site-on-yuz.png" | relURL }}'), url('/site-on-yuz.png'), url('/static/site-on-yuz.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Resmin tam ortasındaki telefon numarasının üzerine binen GÖRÜNMEZ tıklama alanı */
        .invisible-call-link {
            position: absolute;
            display: block;
            /* Ekrandaki numaranın büyüklüğüne göre genişlik ve yükseklik */
            width: 320px;
            height: 90px;
            background: rgba(255, 255, 255, 0); /* Tamamen şeffaf ve görünmez */
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
            border-radius: 50px;
            /* Mobil ve webde tam ortalamak için */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin-top: 40px; /* Numaranın haritadaki dikey konumuna göre gerekirse aşağı yukarı kaydırılabilir */
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <!-- Ziyaretçi resmin ortasındaki numaraya dokunduğu an doğrudan telefon araması açılır -->
        <a href="tel:05309316697" class="invisible-call-link" title="Hemen Ara"></a>
    </div>

</body>
</html>
