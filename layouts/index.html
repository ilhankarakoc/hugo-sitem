<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çilingir Numarası - cilingirnumarasi.com</title>
    <style>
        /* Tüm boşlukları sıfırlayarak resmi tam ekran yapıyoruz */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
        }

        /* Yapay zeka ile hazırladığınız "oto-cilingir.jpg" ana görseli */
        .bg-container {
            width: 100%;
            height: 100%;
            /* Belirttiğiniz oto-cilingir.jpg isminin tüm olasılıkları sisteme eklendi */
            background-image: 
                url('{{ "oto-cilingir.jpg" | relURL }}'), 
                url('/oto-cilingir.jpg'), 
                url('/static/oto-cilingir.jpg'),
                url('{{ "oto-cilingir.JPG" | relURL }}'), 
                url('/oto-cilingir.JPG'), 
                url('/static/oto-cilingir.JPG');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Üst taraftaki "cilingir-numarasi.jpg" logosu için alan */
        .logo-box {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 20;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Resmin tam ortasındaki telefon numarasının üzerine binen GÖRÜNMEZ tıklama alanı */
        .invisible-call-link {
            position: absolute;
            display: block;
            /* Resimdeki numaranın tam üzerine denk gelecek genişlik ve yükseklik alanı */
            width: 340px;
            height: 100px;
            background: rgba(255, 255, 255, 0); /* Tamamen şeffaf ve görünmez */
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
            border-radius: 50px;
            /* Mobil ve webde tam ortalamak için */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin-top: 30px; /* Görseldeki dikey konuma göre gerekirse aşağı yukarı kaydırılabilir */
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <!-- Sol üst köşeye aslan amblemli logonuzu getirir -->
        <div class="logo-box">
            <img src="{{ "cilingir-numarasi.jpg" | relURL }}" onerror="this.src='/cilingir-numarasi.jpg'; this.onerror=function(){this.src='/static/cilingir-numarasi.jpg';}" alt="Logo">
        </div>

        <!-- Ziyaretçi resmin ortasındaki numaraya dokunduğu an doğrudan telefon araması açılır -->
        <a href="tel:05309316697" class="invisible-call-link" title="Hemen Ara"></a>
    </div>

</body>
</html>
