<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çilingir Numarası - cilingirnumarasi.com</title>
    <style>
        /* Tüm tarayıcılarda varsayılan boşlukları sıfırlama */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Arka Plan ve Genel Gövde Ayarları */
        body {
            background-color: #020617;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            position: relative;
            background-image: url('{{ "site-on-yuz.png" | relURL }}'), url('/site-on-yuz.png'), url('/static/site-on-yuz.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Karartma Katmanı */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        /* Üst Menü / Header (Web ve Mobil Uyumlu) */
        header {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
            }
        }

        /* Logo Alanı */
        .logo-container {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(16, 185, 129, 0.6);
            overflow: hidden;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Siber Yeşil Neon Bilgi Başlığı */
        .neon-green-text {
            color: #10b981;
            text-shadow: 0 0 5px #10b981, 0 0 10px #10b981;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Ana İçerik Alanı */
        main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            flex-grow: 1;
        }

        /* Siber Yeşil Neon Kart */
        .neon-green-card {
            background: rgba(4, 10, 15, 0.92);
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
        }

        .neon-green-card h1 {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .neon-green-card h1 span {
            color: #10b981;
        }

        .neon-green-card p {
            font-size: 14px;
            color: #d4d4d4;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Tıklanınca Doğrudan Arayan Yeşil Neon Buton */
        .glow-green-btn {
            display: block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #020617;
            font-size: 18px;
            font-weight: 900;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            margin-bottom: 15px;
            font-bold: true;
        }

        /* WhatsApp Linki */
        .whatsapp-link {
            display: inline-block;
            font-size: 13px;
            color: #a3a3a3;
            text-decoration: none;
            font-weight: 500;
        }

        /* Alt Bilgi / Footer */
        footer {
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #737373;
            background: rgba(10, 10, 10, 0.6);
        }
    </style>
</head>
<body>

    <!-- Arka planı koyulaştıran katman -->
    <div class="overlay"></div>

    <!-- Üst Bilgi (Header) -->
    <header>
        <div class="logo-container">
            <img src="{{ "logo.png" | relURL }}" onerror="this.src='/logo.png'; this.onerror=function(){this.src='/static/logo.png';}" alt="Çilingir Numarası Logo">
        </div>
        <div>
            <div class="neon-green-text">81 İL 973 İLÇE 32.000 MAHALLE - 15 DK - 7/24</div>
            <div class="brand-name">cilingirnumarasi.com</div>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main>
        <div class="neon-green-card">
            <h1>TÜRKİYE GENELİ<br><span>OTO ÇİLİNGİR</span></h1>
            <p>Haritadaki siber ağımızla en yakın usta 15 dakikada yanınızda. Güvenli hizmet için hemen bağlanın.</p>
            
            <!-- Arama Butonu -->
            <a href="tel:05309316697" class="glow-green-btn">📞 0530 931 66 97</a>
            
            <!-- WhatsApp Konum Bağlantısı -->
            <a href="https://wa.me" target="_blank" class="whatsapp-link">💬 WhatsApp Konum At</a>
        </div>
    </main>

    <!-- Alt Bilgi (Footer) -->
    <footer>
        &copy; 2026 cilingirnumarasi.com. Tüm Hakları Saklıdır.
    </footer>

</body>
</html>
